[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evergreen-cv"
version = "0.1.0"
description = "Keep your résumé fresh from GitHub and LinkedIn — automatically, via pull requests you review."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "flushloll" }]
dependencies = ["pyyaml>=6"]
keywords = ["resume", "cv", "json-resume", "github-action", "linkedin"]

[project.optional-dependencies]
ai = ["anthropic>=2.6"]
dev = ["pytest>=8"]

[project.scripts]
evergreen = "evergreen.cli:main"

[project.urls]
Homepage = "https://github.com/flushloll/evergreen"

[tool.setuptools.packages.find]
include = ["evergreen*"]
